# ==============================================================================
# MultiQC configuration for the sc10x pipeline
# ==============================================================================

title: "sc10x Pipeline — Single-Cell 10x Genomics QC Report"
subtitle: "Cell Ranger 7.2.0 | MultiQC 1.21"
intro_text: >
    This report aggregates Cell Ranger QC metrics for all samples
    processed by the sc10x_pipeline workflow.

report_comment: >
    Pipeline sc10x_pipeline v1.0.0 — DSL2 Nextflow

# Modules to include (in display order)
module_order:
    - cellranger
    - custom_content

# Display parameters
show_analysis_paths: true
show_analysis_time: true

# Cell Ranger QC thresholds (for conditional table coloring)
custom_data:
    cellranger_qc_thresholds:
        id: "cellranger_thresholds"
        section_name: "Cell Ranger QC Thresholds"
        description: "Thresholds used for quality control."
        plot_type: "table"

# Columns to prioritize in summary tables
table_columns_placement:
    cellranger:
        estimated_number_of_cells: 100
        mean_reads_per_cell: 200
        median_genes_per_cell: 300
        number_of_reads: 400
        sequencing_saturation: 500
        fraction_reads_in_cells: 600
        median_umi_counts_per_cell: 700
        total_genes_detected: 800

# Thresholds for conditional coloring (green/yellow/red)
table_columns_visible:
    cellranger:
        estimated_number_of_cells: true
        mean_reads_per_cell: true
        median_genes_per_cell: true
        sequencing_saturation: true
        fraction_reads_in_cells: true

# Sample colors (auto-generated if not specified)
# sample_names_rename:
#     - - "old_name"
#       - "new_display_name"

# Data export
export_plots: true
plots_force_interactive: false
make_data_dir: true
data_format: "tsv"

# Output data compression
compress_zip: false

# Logging
log_filesize_limit: 100000000   # 100 MB max per log file
